name: PageSpeed check (temporário)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Rodar PageSpeed Insights e publicar como Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for STRATEGY in mobile desktop; do
            HTTP_CODE=$(curl -s -w "%{http_code}" -o result-$STRATEGY.json \
              "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fviannalegal.com.br&strategy=$STRATEGY&category=performance&category=accessibility&category=seo&category=best-practices")
            echo "HTTP $STRATEGY: $HTTP_CODE" >> http_codes.txt
            sleep 5
          done
          cat http_codes.txt
          echo "--- raw mobile (primeiros 500 chars) ---"
          head -c 500 result-mobile.json

          python3 << 'PYEOF'
          import json

          out = []
          for strategy in ["mobile", "desktop"]:
              with open(f"result-{strategy}.json") as f:
                  raw = f.read()
              try:
                  data = json.loads(raw)
              except Exception as e:
                  out.append(f"## {strategy.upper()}\nErro ao parsear JSON: {e}\nRaw (500 chars): {raw[:500]}\n---\n")
                  continue

              if "error" in data:
                  out.append(f"## {strategy.upper()}\nErro da API: {json.dumps(data['error'])}\n---\n")
                  continue

              lh = data.get("lighthouseResult", {})
              cats = lh.get("categories", {})
              audits = lh.get("audits", {})

              out.append(f"## {strategy.upper()}\n")
              for cat_key, cat_label in [
                  ("performance", "Performance"),
                  ("accessibility", "Accessibility"),
                  ("seo", "SEO"),
                  ("best-practices", "Best Practices"),
              ]:
                  score = cats.get(cat_key, {}).get("score")
                  if score is not None:
                      out.append(f"- **{cat_label}:** {round(score * 100)}/100")

              out.append("\n**Core Web Vitals (lab data):**")
              for audit_key, label in [
                  ("largest-contentful-paint", "LCP"),
                  ("cumulative-layout-shift", "CLS"),
                  ("total-blocking-time", "TBT"),
                  ("first-contentful-paint", "FCP"),
                  ("speed-index", "Speed Index"),
              ]:
                  a = audits.get(audit_key, {})
                  if a:
                      out.append(f"- **{label}:** {a.get('displayValue', 'n/a')}")

              crux = data.get("loadingExperience", {}).get("metrics", {})
              if crux:
                  out.append("\n**Dados reais de utilizadores (CrUX, últimos 28 dias):**")
                  for metric_key, label in [
                      ("LARGEST_CONTENTFUL_PAINT_MS", "LCP"),
                      ("CUMULATIVE_LAYOUT_SHIFT_SCORE", "CLS"),
                      ("INTERACTION_TO_NEXT_PAINT", "INP"),
                      ("FIRST_CONTENTFUL_PAINT_MS", "FCP"),
                  ]:
                      m = crux.get(metric_key)
                      if m:
                          out.append(f"- **{label}:** {m.get('category', 'n/a')} (percentile: {m.get('percentile', 'n/a')})")
              else:
                  out.append("\n_Sem dados reais de utilizadores suficientes (tráfego baixo demais para o CrUX ter amostra)._")

              out.append("\n---\n")

          with open("summary.md", "w") as f:
              f.write("\n".join(out))
          PYEOF

          cat summary.md
          gh issue create --title "pagespeed-viannalegal-${{ github.run_id }}" --body-file summary.md --repo ${{ github.repository }}
