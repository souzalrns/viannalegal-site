name: PageSpeed check (temporário)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PageSpeed pos-fix modulepreload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          for STRATEGY in mobile desktop; do
            curl -s -o result-$STRATEGY.json \
              "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fviannalegal.com.br&strategy=$STRATEGY&category=performance&key=$PAGESPEED_API_KEY"
            sleep 3
          done

          python3 << 'PYEOF'
          import json
          out = []
          for strategy in ["mobile", "desktop"]:
              with open(f"result-{strategy}.json") as f:
                  data = json.load(f)
              if "error" in data:
                  out.append(f"## {strategy.upper()}\nErro: {json.dumps(data['error'])}\n")
                  continue
              lh = data.get("lighthouseResult", {})
              cats = lh.get("categories", {})
              audits = lh.get("audits", {})
              out.append(f"## {strategy.upper()}")
              score = cats.get("performance", {}).get("score")
              out.append(f"- **Performance:** {round(score*100) if score is not None else 'n/a'}/100")
              for k, label in [("largest-contentful-paint","LCP"),("cumulative-layout-shift","CLS"),
                                ("total-blocking-time","TBT"),("first-contentful-paint","FCP"),
                                ("speed-index","Speed Index")]:
                  a = audits.get(k, {})
                  if a:
                      out.append(f"- **{label}:** {a.get('displayValue','n/a')}")
              out.append("")
          with open("summary.md","w") as f:
              f.write("\n".join(out))
          PYEOF
          cat summary.md
          gh issue create --title "pagespeed-pos-modulepreload-${{ github.run_id }}" --body-file summary.md --repo ${{ github.repository }}
