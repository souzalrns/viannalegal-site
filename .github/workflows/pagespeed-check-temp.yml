name: PageSpeed check (temporário)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Rodar PageSpeed Insights mobile e extrair diagnostico de LCP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          curl -s -o result-mobile.json \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fviannalegal.com.br&strategy=mobile&category=performance&key=$PAGESPEED_API_KEY"

          python3 << 'PYEOF'
          import json

          with open('result-mobile.json') as f:
              data = json.load(f)

          if "error" in data:
              print("ERRO:", json.dumps(data["error"]))
              with open("summary.md", "w") as f:
                  f.write(f"Erro da API: {json.dumps(data['error'])}")
              raise SystemExit(0)

          lh = data.get("lighthouseResult", {})
          audits = lh.get("audits", {})

          out = ["## Diagnostico detalhado de LCP (mobile)\n"]

          # 1. Qual elemento exato e o LCP
          lcp_elem = audits.get("largest-contentful-paint-element", {})
          out.append("### Elemento LCP")
          out.append(f"Score: {lcp_elem.get('score')}")
          details = lcp_elem.get("details", {})
          items = details.get("items", [])
          for item in items:
              node = item.get("node", {})
              out.append(f"- Seletor: `{node.get('selector', 'n/a')}`")
              out.append(f"- Snippet: `{node.get('snippet', 'n/a')}`")
              out.append(f"- NodeLabel: {node.get('nodeLabel', 'n/a')}")
          # subitems (breakdown de fases: TTFB, load delay, load time, render delay)
          for item in items:
              for sub in item.get("subItems", {}).get("items", []):
                  out.append(f"  - {sub.get('phase', '?')}: {sub.get('timing', '?')}ms ({sub.get('percent','?')})")

          # 2. lcp-lazy-loaded (se o elemento LCP tem loading=lazy, o que e ruim)
          lazy = audits.get("lcp-lazy-loaded", {})
          out.append(f"\n### lcp-lazy-loaded: score={lazy.get('score')} — {lazy.get('title')}")

          # 3. render-blocking-resources
          rbr = audits.get("render-blocking-resources", {})
          out.append(f"\n### render-blocking-resources: score={rbr.get('score')} — savings {rbr.get('displayValue')}")
          for item in rbr.get("details", {}).get("items", [])[:10]:
              out.append(f"- {item.get('url', 'n/a')[:100]} — {item.get('wastedMs', '?')}ms")

          # 4. server-response-time (TTFB)
          srt = audits.get("server-response-time", {})
          out.append(f"\n### server-response-time (TTFB): {srt.get('displayValue')}")

          # 5. largest-contentful-paint breakdown timing
          lcp_metric = audits.get("largest-contentful-paint", {})
          out.append(f"\n### LCP total: {lcp_metric.get('displayValue')}")

          # 6. network-requests - top 10 maiores/mais lentos
          nr = audits.get("network-requests", {})
          items = nr.get("details", {}).get("items", [])
          items_sorted = sorted(items, key=lambda x: x.get("endTime", 0), reverse=True)[:10]
          out.append("\n### Requests que terminam mais tarde (top 10)")
          for item in items_sorted:
              out.append(f"- endTime={item.get('endTime',0):.0f}ms startTime={item.get('startTime',0):.0f}ms — {item.get('url','n/a')[:90]}")

          # 7. main-thread-tasks / bootup-time
          bt = audits.get("bootup-time", {})
          out.append(f"\n### bootup-time (JS main thread): {bt.get('displayValue')}")
          for item in bt.get("details", {}).get("items", [])[:5]:
              out.append(f"- {item.get('url','n/a')[:80]}: total={item.get('total',0):.0f}ms")

          with open("summary.md", "w") as f:
              f.write("\n".join(out))
          PYEOF

          cat summary.md
          gh issue create --title "lcp-diagnostico-${{ github.run_id }}" --body-file summary.md --repo ${{ github.repository }}
